name: Code Quality Checks

on:
  push:
    branches: [ main, master, development ]
  pull_request:
    branches: [ main, master, development ]

jobs:
  phpstan:
    name: PHPStan Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, xml, curl, zip, gd, pdo, pdo_mysql, pdo_pgsql, redis, intl, bcmath, fileinfo
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=2G
        continue-on-error: true

      - name: Upload PHPStan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phpstan-results
          path: |
            phpstan-baseline.neon
            .phpstan/

  psalm:
    name: Psalm Type Checking
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, xml, curl, zip, gd, pdo, pdo_mysql, pdo_pgsql, redis, intl, bcmath, fileinfo
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run Psalm
        run: vendor/bin/psalm --output-format=github
        continue-on-error: true

      - name: Upload Psalm results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: psalm-results
          path: |
            psalm-baseline.xml
            .psalm/

  phpcs:
    name: PHP CodeSniffer (PSR-12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, xml, curl, zip, gd, pdo, pdo_mysql, pdo_pgsql, redis, intl, bcmath, fileinfo
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run PHPCS
        run: vendor/bin/phpcs --report=checkstyle --report-file=phpcs-report.xml || true

      - name: Upload PHPCS results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phpcs-results
          path: phpcs-report.xml

      - name: Annotate PHPCS results
        if: always()
        run: |
          if [ -f phpcs-report.xml ]; then
            echo "## PHPCS Results" >> $GITHUB_STEP_SUMMARY
            vendor/bin/phpcs --report=summary || true
          fi

  phpmd:
    name: PHPMD Code Smells
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, xml, curl, zip, gd, pdo, pdo_mysql, pdo_pgsql, redis, intl, bcmath, fileinfo
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run PHPMD
        run: vendor/bin/phpmd app,routes,database,config,tests text phpmd.xml --reportfile phpmd-report.txt || true

      - name: Upload PHPMD results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phpmd-results
          path: phpmd-report.txt

      - name: Annotate PHPMD results
        if: always()
        run: |
          if [ -f phpmd-report.txt ]; then
            echo "## PHPMD Results" >> $GITHUB_STEP_SUMMARY
            cat phpmd-report.txt >> $GITHUB_STEP_SUMMARY
          fi

  phpcpd:
    name: PHPCPD Duplicate Code Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, xml, curl, zip, gd, pdo, pdo_mysql, pdo_pgsql, redis, intl, bcmath, fileinfo
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run PHPCPD
        run: |
          vendor/bin/phpcpd \
            --exclude vendor \
            --exclude storage \
            --exclude public \
            --exclude bootstrap/cache \
            --exclude node_modules \
            --min-lines 5 \
            --min-tokens 50 \
            app routes database config tests \
            --log-pmd phpcpd-report.xml || true

      - name: Upload PHPCPD results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phpcpd-results
          path: phpcpd-report.xml

      - name: Annotate PHPCPD results
        if: always()
        run: |
          if [ -f phpcpd-report.xml ]; then
            echo "## PHPCPD Results" >> $GITHUB_STEP_SUMMARY
            vendor/bin/phpcpd \
              --exclude vendor \
              --exclude storage \
              --exclude public \
              --exclude bootstrap/cache \
              --exclude node_modules \
              --min-lines 5 \
              --min-tokens 50 \
              app routes database config tests || true
          fi

  summary:
    name: Code Quality Summary
    runs-on: ubuntu-latest
    needs: [phpstan, psalm, phpcs, phpmd, phpcpd]
    if: always()
    steps:
      - name: Generate Summary
        run: |
          echo "# Code Quality Check Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All code quality checks have completed. Check individual job results for details." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Tools Run:" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ PHPStan (Static Analysis)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Psalm (Type Checking)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ PHPCS (Code Style - PSR-12)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ PHPMD (Code Smells)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ PHPCPD (Duplicate Code Detection)" >> $GITHUB_STEP_SUMMARY

